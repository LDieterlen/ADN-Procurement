[project]
name = "ffe"
version = "0.1.0"
description = "FFE — API et CLI de l'outil de procurement FF&E"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20,<2",
    "fastapi",
    "jinja2>=3.1.6",
    "pillow>=12.3",
    "pydantic-settings",
    "pypdfium2>=4.30",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54,<2.1",
    "typer",
    "uvicorn",
    "weasyprint>=70.0",
]

[project.scripts]
ffe = "ffe.cli:app"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
system-certs = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E9", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  # Expression-based indexes are proven by tests/test_integrity_referential.py; Alembic cannot compare them (D6a.8).
  "ignore:.*expression-based index.*:sqlalchemy.exc.SAWarning",
  "ignore:.*expression-based index.*:UserWarning",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.168.5",
    "pyright",
    "pytest",
    "ruff",
]

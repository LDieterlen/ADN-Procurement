<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
  @page { size: A4{% if landscape %} landscape{% endif %}; margin: 16mm 14mm; @bottom-center { content: "{{ footer }} — page " counter(page) " / " counter(pages); font-size: 8pt; color: #666; } }
  body { font-family: "DejaVu Sans", Helvetica, Arial, sans-serif; font-size: 9.5pt; color: #111; }
  h1 { font-size: 20pt; margin: 0 0 4mm; }
  .muted { color: #666; }
  .small { font-size: 8pt; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 1.5mm 2mm; vertical-align: top; }
  .page { page-break-after: always; }
  .page:last-child { page-break-after: auto; }
  .cover { display: flex; flex-direction: column; justify-content: center; height: 240mm; }
  .cover .agency { position: absolute; top: 0; left: 0; }
  .head td { border: none; padding: 0 0 4mm; }
  .num { text-align: right; white-space: nowrap; }
  .code { font-family: "DejaVu Sans Mono", monospace; font-size: 8.5pt; color: #333; white-space: nowrap; }
  .list th, .list td { border: 0.2mm solid #999; }
  .list th { background: #eee; text-transform: uppercase; font-size: 7.5pt; text-align: left; }
  .list tr.location td { background: #f6f6f6; font-weight: bold; }
  .list td.center { text-align: center; }
  .thumb { width: 14mm; height: 14mm; object-fit: contain; }
  .sheet { display: grid; grid-template-columns: 2fr 1fr; gap: 6mm; }
  .visuals { border: 0.2mm solid #999; padding: 4mm; min-height: 150mm; }
  .photo { width: 100%; max-height: 120mm; object-fit: contain; }
  .drawing { margin-top: 6mm; max-height: 80mm; }
  .facts { border-collapse: collapse; }
  .facts th { background: #eee; text-align: left; border: 0.2mm solid #999; font-size: 7.5pt; padding: 1mm 2mm; text-transform: uppercase; }
  .facts td { border: 0.2mm solid #999; padding: 1.5mm 2mm; }
  .facts td.tall { height: 14mm; }
  .pill { display: inline-block; border: 0.2mm solid #111; border-radius: 3mm; padding: 0 2mm; font-size: 7.5pt; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>

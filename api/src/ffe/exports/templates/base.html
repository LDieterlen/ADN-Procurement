{# The paper: warm and tinted on screen, plain white for a printer (`printable`, 2026-10-15). #}
{% set paper = "#ffffff" if printable else "#fbfaf7" %}
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
  /* Design « Fiche déco 1b Catalogue », v2 (references/Fiche deco/Spec fiche 1b.md, 2026-10-15): a warm
     palette, Newsreader for the titles, IBM Plex Sans for the text, IBM Plex Mono for codes and labels. Units in px:
     1 px = 1/96 in, an A4 page is 794 × 1123 px, as in the mock-up (A3 landscape for the installation pages). */
  @font-face { font-family: "Newsreader"; src: url("{{ assets_url }}/Newsreader[opsz,wght].ttf"); font-weight: 200 800; }
  @font-face { font-family: "IBM Plex Sans"; src: url("{{ assets_url }}/IBMPlexSans[wdth,wght].ttf"); font-weight: 100 700; }
  @font-face { font-family: "IBM Plex Mono"; src: url("{{ assets_url }}/IBMPlexMono-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "IBM Plex Mono"; src: url("{{ assets_url }}/IBMPlexMono-Medium.ttf"); font-weight: 500; }
  @page {
    size: {{ page_size | default("A4") }}{% if landscape %} landscape{% endif %};
    margin: 36px 44px 40px;
    background: {{ paper }};
    @bottom-left { content: "{{ footer | replace('\\', '\\\\') | replace('"', '\\"') | safe }}"; font: 400 10px "IBM Plex Sans", sans-serif; color: #a39b91; vertical-align: top; padding-top: 6px; }
    @bottom-right { content: "page " counter(page) " / " counter(pages); font: 400 10px "IBM Plex Sans", sans-serif; color: #a39b91; vertical-align: top; padding-top: 6px; }
  }
  html { background: {{ paper }}; }
  body { font-family: "IBM Plex Sans", "DejaVu Sans", sans-serif; font-size: 13px; line-height: 1.4; color: #1c1a17; margin: 0; }
  a { color: #6d4a3a; text-decoration: none; }
  h1 { margin: 0; font: 500 36px/1.1 "Newsreader", serif; letter-spacing: -0.01em; }
  .mono { font-family: "IBM Plex Mono", monospace; }
  .label { font: 400 10px "IBM Plex Mono", monospace; letter-spacing: 0.12em; text-transform: uppercase; color: #6d4a3a; }
  .muted { color: #6b645c; }
  .faint { color: #a39b91; }
  .small { font-size: 11px; }
  .page { page-break-after: always; }
  .page:last-child { page-break-after: auto; }
  table { width: 100%; border-collapse: collapse; }
  td, th { vertical-align: top; }

  /* « Racoon Studio » centred in the bottom margin of every sheet page: a fixed box repeats on each
     page; the logo and the two lines « RACOON / STUDIO » are centred on each other. */
  .studio-mark { position: fixed; left: 0; right: 0; bottom: -20px; display: flex; justify-content: center; align-items: center; gap: 6px; }
  .studio-mark img { width: 15px; height: 15px; }
  .studio-mark span { font: 400 6.5px/1.15 "IBM Plex Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase; color: #a39b91; }
  /* Running head of the sheets (2026-10-15, _head.html): the designer at left, the project in the
     middle, the procurement company at right; three equal columns so the project name stays centred. */
  .sheet-head { width: 100%; table-layout: fixed; border-collapse: collapse; border-bottom: 1.5px solid #1c1a17; }
  .sheet-head td { height: 40px; padding: 0 0 12px; vertical-align: middle; }
  .sheet-head td.side { width: 30%; }
  .sheet-head img { max-width: 120px; max-height: 38px; vertical-align: middle; }
  .sheet-head .project { text-align: center; }
  .sheet-head .project .name { font: 500 16px/1.15 "Newsreader", serif; }
  .sheet-head .project .sub { margin-top: 2px; font-size: 10px; color: #6b645c; }
  .sheet-head .procurement { text-align: right; font: 600 11px "IBM Plex Sans", sans-serif; }
  .sheet-head .procurement span { vertical-align: middle; }
  .sheet-head .procurement span + img { margin-left: 10px; }

  /* Cover */
  .cover { height: 1040px; display: flex; flex-direction: column; justify-content: space-between; }
  .cover .title { margin-top: 300px; }
  .cover .rule { border-top: 2px solid #1c1a17; width: 120px; margin-bottom: 20px; }
  .cover h1 { font-size: 44px; margin-top: 10px; }
  .cover .client { font-size: 16px; color: #6b645c; margin-top: 8px; }
  .cover .facts { margin-top: 36px; display: grid; grid-template-columns: 110px 1fr; row-gap: 8px; font-size: 13px; }

  /* Listing (also the landscape list.html) */
  .list th { font: 400 10px "IBM Plex Mono", monospace; letter-spacing: 0.1em; text-transform: uppercase; color: #6b645c; text-align: left; padding: 8px 8px 6px 0; border-bottom: 1px solid #1c1a17; }
  .list td { padding: 8px 8px 8px 0; border-bottom: 1px solid #e4e0d9; font-size: 12px; }
  .list tr.location td { padding-top: 18px; padding-bottom: 6px; border-bottom: 1px solid #1c1a17; font-weight: 600; font-size: 12.5px; }
  .list tr.location .where { font-weight: 400; color: #6b645c; }
  .list tbody tr { break-inside: avoid; }  /* a row never cut between two pages */
  .list td.code { font: 400 11.5px "IBM Plex Mono", monospace; white-space: nowrap; }
  .list td.num, .list th.num { text-align: right; white-space: nowrap; }
  .list td.center, .list th.center { text-align: center; }
  .list th.nowrap, .list td.nowrap { white-space: nowrap; }
  .thumb { width: 52px; height: 52px; object-fit: contain; }
  .pill { display: inline-block; border: 1px solid #1c1a17; border-radius: 10px; padding: 1px 8px; font-size: 10.5px; white-space: nowrap; }
  .pill.filled { background: #1c1a17; color: #fbfaf7; }

  /* Spec sheet (« Fiche 1b » v2) — px boxes, tables and absolute positions (WeasyPrint lays them out
     reliably, never CSS grid). Content box: 706 × 1047 px; the sheet is a fixed-height box so the
     image band and the bottom block never move. */
  .sheet { position: relative; height: 1030px; }
  .titling { margin-top: 26px; }
  .titling td { padding: 0; vertical-align: bottom; }
  .titling td.gap { width: 32px; }
  .titling td.where-box { width: 230px; }
  .titling .label { font-size: 11px; }
  .titling h1 { margin-top: 10px; font: 500 38px/1.08 "Newsreader", serif; letter-spacing: -0.015em; max-height: 124px; overflow: hidden; }
  .titling h1.long { font-size: 30px; max-height: 98px; }  /* long names: three lines at most */
  .titling .meta { margin-top: 12px; font-size: 12px; color: #6b645c; }
  .titling .meta span { margin-right: 18px; }
  .titling .meta strong { color: #1c1a17; font-weight: 600; }
  .loc { background: #2a2420; color: #fbfaf7; padding: 16px 18px; }
  /* Marks of a sheet (2026-10-16), one system and one colour each, muted to the paper (slate blue,
     sage green: told apart by hue and lightness), never red nor orange: a strip along the page edge and a tag above the title; the location box
     keeps its colour. « Nouveau » (blue): a code shown for the first time since the previous
     diffusion; « Modifié » (sage green): its product changed, new indice; option (warm grey,
     ADR-0021): an alternative. In the lists: the row marked on its left edge, a small tag. */
  .sheet.mark::before { content: ""; position: absolute; left: -44px; top: -36px; width: 8px; height: 1123px; background: var(--mark); }
  .mark-new { --mark: #46667f; --mark-soft: #e4eaef; }
  .mark-revised { --mark: #6b8a72; --mark-soft: #e6ede7; }
  .mark-option { --mark: #9a948c; --mark-soft: #efece8; }
  .kicker { margin-bottom: 10px; font: 500 11px "IBM Plex Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mark); }
  .kicker .tag { display: inline-block; padding: 4px 9px 3px; margin-right: 9px; background: var(--mark); color: #ffffff; }
  .mark-option .kicker .tag { background: var(--mark-soft); color: #5f5952; }
  tr.mark td:first-child { border-left: 3px solid var(--mark); padding-left: 8px; }
  tr.mark-option td { background: var(--mark-soft); }
  tr.mark-option td.ffe { padding-left: 14px; color: #6b645c; }
  .opt-name { font: 500 9.5px "IBM Plex Mono", monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mark); margin-right: 6px; }
  .legend span { margin-right: 14px; white-space: nowrap; }
  .list td.legend.key { padding-top: 12px; border-bottom: 0; font-size: 9.5px; color: #8a837b; }
  .legend.key i { width: 6px; height: 6px; }
  .legend i { display: inline-block; width: 8px; height: 8px; margin-right: 5px; background: var(--mark); }
  .loc .label { font-size: 9px; color: #b8a89c; }
  .loc .name { font: 500 30px/1.1 "Newsreader", serif; margin-top: 6px; }
  .loc .sub { font-size: 12px; color: #e6dcd3; margin-top: 4px; }
  .band { position: relative; height: 330px; margin-top: 24px; }
  .band .img { position: absolute; box-sizing: border-box; overflow: hidden; }
  .band .img.empty { background: repeating-linear-gradient(135deg, #ece8e1 0, #ece8e1 6px, #e3ded6 6px, #e3ded6 12px); }
  .band .img img { width: 100%; height: 100%; display: block; }  /* fit and background: pdf.band_layout */
  .band .img.plan { background: #fff; border: 1px solid #e4e0d9; }
  .band .tag { position: absolute; left: 10px; bottom: 10px; background: {{ paper }}; padding: 3px 7px; font: 400 9px "IBM Plex Mono", monospace; letter-spacing: 0.12em; text-transform: uppercase; color: #6b645c; }
  .usage-note { margin-top: 4px; font-size: 9px; color: #a39b91; text-align: right; }
  .section-head { margin-top: 26px; padding-bottom: 8px; border-bottom: 1px solid #1c1a17; }
  .section-head td { padding: 0; vertical-align: bottom; }
  .section-head .aside { font-size: 11px; color: #6b645c; text-align: right; }
  .cells { border-left: 1px solid #e4e0d9; }
  .cells td { width: 33.33%; padding: 11px 14px; border-right: 1px solid #e4e0d9; border-bottom: 1px solid #e4e0d9; }
  .cells td.wide { width: auto; }
  .cells .k { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: #6b645c; }
  .cells .v { font-size: 13px; margin-top: 4px; line-height: 1.4; }
  .cells .v.mono { font: 400 13px "IBM Plex Mono", monospace; }
  .cells .v.link { font: 400 12px "IBM Plex Mono", monospace; word-break: break-all; }
  .cells .v.empty { color: #a39b91; }
  .columns { margin-top: 22px; border-collapse: separate; border-spacing: 24px 0; margin-left: -24px; width: calc(100% + 48px); }
  .columns td { padding: 0; vertical-align: top; }
  .block-head { font-size: 10px; padding-bottom: 6px; border-bottom: 1px solid #1c1a17; }
  .block-body { font-size: 12.5px; line-height: 1.7; padding-top: 8px; }
  .ruled { height: 84px; overflow: hidden; font-size: 12.5px; }
  .rule-line { height: 28px; line-height: 28px; border-bottom: 1px solid #e4e0d9; overflow: hidden; }
  .sheet-foot { position: absolute; left: -24px; bottom: 0; width: 754px; margin: 0; }  /* 706 + the two 24 px spacings */
  .frame { height: 60px; box-sizing: border-box; margin-top: 8px; padding: 12px 14px 0; font-size: 12.5px; line-height: 1.5; }
  .frame.issued { border: 1px solid #e4e0d9; }
  .frame.sign { border: 1px dashed #c9c2b8; }
</style>
</head>
<body>
{% if studio_footer %}<div class="studio-mark"><img src="{{ assets_url }}/racoon-footer.svg" alt=""><span>Racoon<br>Studio</span></div>{% endif %}
{% block body %}{% endblock %}
</body>
</html>

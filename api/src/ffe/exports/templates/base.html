<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
  /* Design « Fiche déco 1b Catalogue » (références/Fiche deco, 2026-10-13) : palette chaude, Playfair pour
     les titres, IBM Plex Sans pour le texte, IBM Plex Mono pour les codes et les libellés. Unités en px :
     1 px = 1/96 in, la page A4 fait 794 × 1123 px, comme la maquette. */
  @font-face { font-family: "Playfair Display"; src: url("{{ assets_url }}/PlayfairDisplay[wght].ttf"); font-weight: 400 900; }
  @font-face { font-family: "IBM Plex Sans"; src: url("{{ assets_url }}/IBMPlexSans[wdth,wght].ttf"); font-weight: 100 700; }
  @font-face { font-family: "IBM Plex Mono"; src: url("{{ assets_url }}/IBMPlexMono-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "IBM Plex Mono"; src: url("{{ assets_url }}/IBMPlexMono-Medium.ttf"); font-weight: 500; }
  @page {
    size: A4{% if landscape %} landscape{% endif %};
    margin: 36px 44px 40px;
    background: #fbfaf7;
    @bottom-left { content: "{{ footer }}"; font: 400 10px "IBM Plex Sans", sans-serif; color: #a39b91; vertical-align: top; padding-top: 6px; }
    @bottom-right { content: "page " counter(page) " / " counter(pages); font: 400 10px "IBM Plex Sans", sans-serif; color: #a39b91; vertical-align: top; padding-top: 6px; }
  }
  html { background: #fbfaf7; }
  body { font-family: "IBM Plex Sans", "DejaVu Sans", sans-serif; font-size: 13px; line-height: 1.4; color: #1c1a17; margin: 0; }
  a { color: #6d4a3a; text-decoration: none; }
  h1 { margin: 0; font: 500 36px/1.1 "Playfair Display", serif; letter-spacing: -0.01em; }
  .mono { font-family: "IBM Plex Mono", monospace; }
  .label { font: 400 10px "IBM Plex Mono", monospace; letter-spacing: 0.12em; text-transform: uppercase; color: #6d4a3a; }
  .muted { color: #6b645c; }
  .faint { color: #a39b91; }
  .small { font-size: 11px; }
  .page { page-break-after: always; }
  .page:last-child { page-break-after: auto; }
  table { width: 100%; border-collapse: collapse; }
  td, th { vertical-align: top; }

  /* Running head */
  .head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1.5px solid #1c1a17; }
  .head .brand { display: flex; align-items: center; gap: 10px; font: 600 12px "IBM Plex Sans", sans-serif; letter-spacing: 0.14em; }
  .head .brand img { width: 30px; height: 30px; }
  .head .where { font-size: 11px; color: #6b645c; text-align: right; line-height: 1.5; }

  /* Cover */
  .cover { height: 1040px; display: flex; flex-direction: column; justify-content: space-between; }
  .cover .title { margin-top: 300px; }
  .cover .rule { border-top: 2px solid #1c1a17; width: 120px; margin-bottom: 20px; }
  .cover h1 { font-size: 44px; margin-top: 10px; }
  .cover .client { font-size: 16px; color: #6b645c; margin-top: 8px; }
  .cover .facts { margin-top: 36px; display: grid; grid-template-columns: 110px 1fr; row-gap: 8px; font-size: 13px; }

  /* Listing (also the landscape list.html) */
  .list th { font: 400 10px "IBM Plex Mono", monospace; letter-spacing: 0.1em; text-transform: uppercase; color: #6b645c; text-align: left; padding: 8px 8px 6px 0; border-bottom: 1px solid #1c1a17; }
  .list td { padding: 8px 8px 8px 0; border-bottom: 1px solid #e4e0d9; font-size: 12px; }
  .list tr.location td { padding-top: 18px; padding-bottom: 6px; border-bottom: 1px solid #1c1a17; font-weight: 600; font-size: 12.5px; }
  .list tr.location .where { font-weight: 400; color: #6b645c; }
  .list td.code { font: 400 11.5px "IBM Plex Mono", monospace; white-space: nowrap; }
  .list td.num, .list th.num { text-align: right; white-space: nowrap; }
  .list td.center, .list th.center { text-align: center; }
  .list th.nowrap, .list td.nowrap { white-space: nowrap; }
  .thumb { width: 52px; height: 52px; object-fit: contain; }
  .pill { display: inline-block; border: 1px solid #1c1a17; border-radius: 10px; padding: 1px 8px; font-size: 10.5px; white-space: nowrap; }
  .pill.filled { background: #1c1a17; color: #fbfaf7; }

  /* Spec sheet (1b) — tables, not CSS grid: WeasyPrint lays tables out reliably */
  .hero { margin-top: 28px; border-collapse: separate; border-spacing: 0; }
  .hero td { padding: 0; }
  .hero td.visual { width: 335px; padding-right: 36px; }
  .photo-box { width: 335px; height: 335px; background: #ece8e1; border: 1px solid #e3ded6; text-align: center; font: 400 11px "IBM Plex Mono", monospace; color: #6b645c; line-height: 335px; }
  .photo-box.has-photo { background: #fff; line-height: normal; }
  .photo-box img { width: 335px; height: 335px; object-fit: contain; display: block; }
  .drawing { margin-top: 12px; text-align: center; }
  .drawing img { max-width: 335px; max-height: 120px; object-fit: contain; }
  .hero td.text { height: 335px; vertical-align: top; }
  .hero h1.long { font-size: 26px; }  /* long names: the title stays within three lines */
  .hero .meta { margin-top: 12px; font-size: 13px; color: #6b645c; }
  .tiles { margin-top: 0; border-collapse: separate; border-spacing: 12px 0; margin-left: -12px; width: calc(100% + 24px); }
  .tiles td.tile { padding: 14px 16px; vertical-align: top; }
  .tile.dark { background: #2a2420; color: #fbfaf7; }
  .tile.dark .label { color: #b8a89c; }
  .tile.line { border: 1px solid #1c1a17; }
  .tile .big { font: 500 30px/1.1 "Playfair Display", serif; margin-top: 4px; }
  .tile .value { font-size: 13px; font-weight: 500; margin-top: 8px; }
  .section-head { margin-top: 36px; padding-bottom: 8px; border-bottom: 1px solid #1c1a17; }
  .section-head td { padding: 0; }
  .section-head .aside { font-size: 11px; color: #6b645c; text-align: right; }
  .cells { border-left: 1px solid #e4e0d9; }
  .cells td { width: 33.33%; padding: 12px 14px; border-right: 1px solid #e4e0d9; border-bottom: 1px solid #e4e0d9; }
  .cells td.wide { width: auto; }
  .cell .k, .cells .k { font-size: 10px; color: #6b645c; letter-spacing: 0.06em; text-transform: uppercase; }
  .cells .v { font-size: 13px; margin-top: 4px; line-height: 1.4; }
  .cells .v.mono { font: 400 12.5px "IBM Plex Mono", monospace; }
  .cells .v.empty { color: #a39b91; }
  .columns { margin-top: 24px; border-collapse: separate; border-spacing: 24px 0; margin-left: -24px; width: calc(100% + 48px); }
  .columns td { padding: 0; vertical-align: top; }
  .block-head { padding-bottom: 6px; border-bottom: 1px solid #1c1a17; }
  .block-body { font-size: 12.5px; line-height: 1.7; padding-top: 8px; }
  .ruled { padding-top: 8px; font-size: 12.5px; }
  .rule-line { min-height: 27px; line-height: 27px; border-bottom: 1px solid #e4e0d9; }
  .text-stack { height: 335px; border-collapse: collapse; }
  .text-stack td { padding: 0; }
  .text-stack td.top { vertical-align: top; height: 250px; }
  .text-stack td.foot { vertical-align: bottom; height: 1px; }
  .bottom { margin-top: 24px; }
  .bottom td { vertical-align: bottom; }
  .sign { height: 56px; border: 1px dashed #c9c2b8; margin-top: 8px; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
